name: Sift Science
description: >-
  Sift (formerly Sift Science) is a Digital Trust & Safety platform that uses machine
  learning to help online businesses stop payment fraud, account takeover, fake-account
  creation, and content abuse in real time. Developers integrate Sift through modern
  REST APIs (Events, Score, Labels, Decisions, Workflows, and Verification), a client-side
  JavaScript snippet, and mobile SDKs for iOS and Android. The platform scores users and
  transactions against a global network of over one trillion annual events, returns risk
  scores synchronously or asynchronously, and lets teams automate business actions via
  Decisions and Workflows. Sift is used by 700+ global brands including Hertz, Yelp, and
  Poshmark.
