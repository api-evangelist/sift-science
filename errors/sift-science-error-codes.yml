method: searched
source: https://developers.sift.com/docs/curl/apis-overview/error-codes
format: sift-status-code
envelope:
  description: >-
    Sift API responses carry a numeric `status` field (0 = success), a human-readable
    `error_message`, an echo of the `request`, and the server `time`. A non-zero `status`
    indicates an API-level error even when the HTTP status is 200. Unexpected server
    problems surface as HTTP 500.
  fields:
  - status
  - error_message
  - request
  - time
  warnings:
    description: >-
      Non-fatal validation warnings can be requested by adding `&fields=warnings`; they
      are returned under a `warnings` object with `count` and `items[].message`.
